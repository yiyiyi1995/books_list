name: 每周新增书单
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-books
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/weekly_update.py
      - name: Commit additions only
        run: |
          git config user.name 'books-list-bot'
          git config user.email 'books-list-bot@users.noreply.github.com'
          git add catalog.json catalog.js
          if ! git diff --cached --quiet; then
            git commit -m 'books: append weekly curated recommendation'
            git push
          fi
