<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#168df1"><title>书间 · 我的阅读书房</title><link rel="stylesheet" href="style.css?v=8"><body>
<header><a class="brand" href="#">书间<span>BOOKS / 私人阅读书房</span></a><button id="add" class="primary">＋ 添加书籍</button></header>
<main><section class="hero"><div><h1>在书页之间，<br>遇见更大的世界。</h1><p>读诗，读历史，也读自己。让每一次阅读都有迹可循。</p><div class="heroactions"><button id="resume" class="primary">开始一段阅读 ↗</button><button id="englishShortcut">英文听读练习 →</button></div></div><div class="shelfcount"><strong id="count">68</strong><span>本藏书</span></div></section>
<section id="shelf"><div class="sectionhead"><div><small>YOUR COLLECTION</small><h2>我的书架</h2></div><input id="search" type="search" placeholder="搜索书名、作者、简介…" aria-label="搜索书籍"></div><div class="mobile-filter-row"><label class="category-picker"><span>分类</span><select id="mobileCategory" aria-label="选择书单分类"></select></label><button id="filterToggle" aria-expanded="false" aria-controls="extraFilters">筛选 <span aria-hidden="true">⌄</span></button></div><div id="filters"></div><div class="toolbar"><span id="resultCount"></span><div id="extraFilters" class="extra-filters"><select id="availabilityFilter" aria-label="内容可用性"><option value="">全部书籍</option><option value="direct">可直接阅读</option><option value="external">尚未接入全文</option></select><select id="statusFilter" aria-label="阅读状态"><option value="">全部阅读状态</option><option value="unread">未开始</option><option value="reading">阅读中</option><option value="done">已读完</option></select></div></div><div id="grid"></div></section>
</main><footer><span>书间 BOOKS · 一页一页，慢慢来。</span><details class="backup"><summary>备份与恢复</summary><div><button id="export">导出备份</button><label class="button">恢复备份<input id="restore" type="file" accept="application/json" hidden></label><p>备份包含私人读后感，请妥善保管。</p></div></details><small id="storageHint" hidden></small></footer>
<dialog id="detail" aria-labelledby="detailNavTitle"><div class="modalhead"><button data-close="detail" class="navback" aria-label="返回书架"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>书架</span></button><strong id="detailNavTitle">书籍详情</strong><span class="navspacer"></span></div><div id="detailBody" class="dialogbody"></div></dialog>
<dialog id="addDialog" aria-labelledby="addNavTitle"><div class="modalhead"><button data-close="addDialog" class="navback" aria-label="返回书架"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>取消</span></button><strong id="addNavTitle">添加书籍</strong><span class="navspacer"></span></div><form id="addForm"><label>书名<input name="title" required maxlength="200"></label><label>作者 / 译者<input name="author" required maxlength="200"></label><label>板块<select name="category" id="categorySelect"></select></label><label>简介<textarea name="description" required></textarea></label><label>推荐理由<textarea name="recommendation"></textarea></label><button class="primary">添加书籍</button></form></dialog>
<dialog id="reader" aria-labelledby="readerTitle"><div class="readerhead"><div class="reader-nav"><button id="readerBack" class="navback" aria-label="返回书架"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>书架</span></button><strong id="readerTitle"></strong><button id="readerNote" class="nav-action" aria-label="写读后感"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 5 19 10M4 20l5-1L20 8a2.8 2.8 0 0 0-4-4L5 15z"/></svg><span>笔记</span></button></div><div class="reader-tools"><label class="chapter-picker"><span>目录</span><select id="chapterSelect" aria-label="选择章节"></select></label><select id="fontSize" aria-label="字体大小"><option value="18">小字</option><option value="21" selected>中字</option><option value="25">大字</option></select></div></div><div id="speechControls" hidden><button id="speak" class="primary">▶ 朗读</button><button id="pauseSpeech">暂停</button><button id="stopSpeech">停止</button><label><span class="speech-rate-label">语速</span><select id="speechRate" aria-label="朗读语速"><option value="0.7">0.7× 慢速</option><option value="0.85">0.85×</option><option value="1" selected>1× 常速</option></select></label><span id="speechHint">合成语音 · 点击正文段落可从此处听起</span></div><article id="readerText"></article><div class="readerfooter"><button id="readerPrev">‹ 上一篇</button><span id="progress"></span><button id="readerNext">下一篇 ›</button></div></dialog><div id="toast" role="status"></div><script src="catalog.js?v=4"></script><script src="reading.js?v=3"></script>
